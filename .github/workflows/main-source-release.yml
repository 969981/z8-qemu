# Publish only the reviewed main branch after privacy and contract tests pass.
# The upstream-main tracking branch and 3.12 research branch are never released.
name: Release validated z8-qemu sources

on:
  workflow_run:
    workflows: ['Source-only checks']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: z8-qemu-source-release
  cancel-in-progress: false

jobs:
  source-release:
    if: >-
      github.repository == '969981/z8-qemu' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == '969981/z8-qemu'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Confirm the validated commit belongs to main
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main
          tag="source-${sha:0:12}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Make source-only package
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar --prefix=z8-qemu/ HEAD | gzip -n > "dist/z8-qemu-source-${GITHUB_SHA:0:12}.tar.gz"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish a source-only prerelease
        if: steps.meta.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          COMMIT: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "z8-qemu source snapshot ${COMMIT:0:12}" \
            --notes 'Source-only archive from the reviewed main branch. No Nikon firmware, extracted camera binaries or keys are bundled; upstream-main and 3.12 remain independently tracked.' \
            --prerelease
